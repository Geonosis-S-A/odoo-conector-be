[project]
name = "odoo-conector-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=3.4.3",
    "bcrypt>=4.3.0",
    "fastapi[standard]>=0.115.12",
    "jwt>=1.3.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.9.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "python-jose>=3.4.0",
    "ruff>=0.11.9",
    "sqlmodel>=0.0.24",
    "standard>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
