[project]
name = "odoo-conector-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "alembic>=1.16.1",
    "apscheduler>=3.10.4",
    "asyncio>=3.4.3",
    "bcrypt>=4.3.0",
    "fastapi[standard]>=0.115.12",
    "jwt>=1.3.1",
    "langchain>=1.0.5",
    "langchain-google-genai>=3.0.3",
    "langchain-google-vertexai>=3.0.3",
    "langchain-openai>=1.0.2",
    "pandas[excel]>=2.3.2",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "python-jose>=3.4.0",
    "pytz>=2024.1",
    "rapidfuzz>=3.14.3",
    "redis>=5.0.0",
    "requests>=2.32.3",
    "resend>=2.11.0",
    "ruff>=0.11.9",
    "sendgrid>=6.12.2",
    "sqlmodel>=0.0.24",
    "standard>=1.0.3",
    "azure-identity>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
